<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>whohashim.com | Fantasy League History</title>
<meta name="description" content="League history for two fantasy leagues: Fantrax Platinum (NBA) and JMML (Football).">
<meta name="theme-color" content="#0c0f18">
<meta property="og:type" content="website">
<meta property="og:site_name" content="whohashim.com">
<meta property="og:title" content="whohashim.com | Fantasy League History">
<meta property="og:description" content="Pick a league: Fantrax Platinum (NBA) or JMML (Football).">
<meta property="og:url" content="https://whohashim.com/">
<meta property="og:image" content="https://whohashim.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://whohashim.com/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0f18'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%23f97316'/%3E%3C/svg%3E">
<style>
:root { --bg: #0f1117; --panel: #111827; --line: #1e293b; --text: #f8fafc; --mute: #94a3b8; --nba: #f97316; --nfl: #22c55e; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 1000px; width: 100%; margin: 0 auto; padding: 64px 24px; }
.brand { font-size: 14px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--nba); margin-bottom: 18px; }
h1 { font-size: clamp(34px, 6vw, 56px); line-height: 1.05; font-weight: 700; }
.lede { font-size: 17px; color: var(--mute); margin: 16px 0 44px; max-width: 520px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
a.card { position: relative; display: block; text-decoration: none; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px; overflow: hidden; transition: transform .18s, border-color .18s, box-shadow .18s; }
a.card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--accent); }
a.card:hover, a.card:focus-visible { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 14px 34px rgba(0,0,0,.45); outline: none; }
.nba { --accent: var(--nba); } .nfl { --accent: var(--nfl); }
.icon { width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center; font-size: 32px; background: color-mix(in srgb, var(--accent) 16%, transparent); margin-bottom: 22px; }
.sport { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h2 { font-size: 28px; margin: 6px 0 0; }
.go { margin-top: 24px; font-weight: 600; font-size: 15px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.go span { transition: transform .18s; } a.card:hover .go span { transform: translateX(5px); }
.host { font-size: 12px; color: #475569; margin-top: 4px; }
@media (max-width: 720px) { .cards { grid-template-columns: 1fr; } main { padding: 40px 20px; } }
</style>
</head>
<body>
<main>
  <div class="brand">whohashim.com</div>
  <h1>Fantasy league history.</h1>
  <p class="lede">Pick a league.</p>
  <div class="cards">
    <a class="card nba" href="https://fantrax.whohashim.com/">
      <div class="icon" aria-hidden="true">🏀</div>
      <div class="sport">Basketball · NBA</div>
      <h2>Fantrax Platinum</h2>
      <div class="go">Open the NBA league <span>→</span></div>
      <div class="host">fantrax.whohashim.com</div>
    </a>
    <a class="card nfl" href="https://jmml.whohashim.com/">
      <div class="icon" aria-hidden="true">🏈</div>
      <div class="sport">Football</div>
      <h2>JMML</h2>
      <div class="go">Open JMML Football <span>→</span></div>
      <div class="host">jmml.whohashim.com</div>
    </a>
  </div>
</main>
</body>
</html>
